k and life apart.\n\n## Requirements\n\n- A switch at the top of the list.\n","display":"doing"},{"id":"del","kind":"work","file":"work/del.md","title":"Delete a todo","fm":{"id":"del","kind":"work","title":"Delete a todo","stage":"s1","lane":"Capture","order":3,"status":"done","source":"user","basis":"7ee6fcc6.e3b0c442"},"body":"\n## Why\n\nRemove what is no longer needed.\n\n## Requirements\n\n- A single todo can be deleted.\n","display":"done"},{"id":"done","kind":"work","file":"work/done.md","title":"Mark as done","fm":{"id":"done","kind":"work","title":"Mark as done","stage":"s1","lane":"Capture","order":2,"status":"done","source":"user","basis":"9148337c.e3b0c442"},"body":"\n## Why\n\nCheck off what is finished.\n\n## Requirements\n\n- A todo can be marked done and undone.\n","display":"done"},{"id":"export","kind":"work","file":"work/export.md","title":"Export JSON","fm":{"id":"export","kind":"work","title":"Export JSON","stage":"s2","lane":"Data","order":3,"status":"planned"},"body":"\n## Why\n\nGet all todos out as one file.\n\n## Requirements\n\n- Export every todo with its category.\n","display":"planned"},{"id":"filter","kind":"work","file":"work/filter.md","title":"Show open only","fm":{"id":"filter","kind":"work","title":"Show open only","stage":"s1","lane":"Viewing","order":1,"status":"done","before":["del"],"source":"user","basis":"71dec501.e3b0c442"},"body":"\n## Why\n\nSee only what is left for today.\n\n## Requirements\n\n- The list can show open todos only.\n- It can be combined with a category filter.\n\n## Arrangement\n\n\"Do this first,\" said the user: before delete, same stage.\n","display":"review"},{"id":"migrate","kind":"work","file":"work/migrate.md","title":"Migrate old todos","fm":{"id":"migrate","kind":"work","title":"Migrate old todos","stage":"s2","lane":"Data","order":2,"status":"done","requires":["cat-field"],"source":"agent","basis":"0fd1cf49.45ea8916"},"body":"\n## Why\n\nExisting todos need a category.\n\n## Requirements\n\n- A   }

  function post(sub, method, body) {
    return fetch(API + sub, { method: method, headers: { 'content-type': 'application/json', 'x-omino-token': SVC.token }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.error || r.status); e.status = r.status; e.data = j; throw e; } return j; }); });
  }
  // after a change the page reloads from the plan as it now is, and says what happened
  function done(msg) { reloading = true; try { sessionStorage.setItem('omino-toast', msg); } catch (e) {} location.reload(); }
  var lang = zh ? 'zh' : 'en';
  function send(btn) {
    var n = byId[state.sel]; if (!n) return;
    var act = btn.getAttribute('data-act');
    var box = btn.closest('.qa') || btn.closest('.acts');
    var ta = box && box.querySelector('textarea');
    var text = ta ? ta.value.trim() : '';
    if ((act === 'answer' || act === 'dispute' || act === 'comment') && !text) { if (ta) ta.focus(); return; }
    if (!EDIT) {
      var t = n.kind === 'stage' ? 'L' + n.fm.level + ' · ' + n.title : n.title, f = n.file;
      var msg = act === 'answer' ? L.cpQ(t, f, btn.getAttribute('data-q'), text) : act === 'confirm' ? L.cpConfirm(t, f) : act === 'dispute' ? L.cpDispute(t, f, text) :
        act === 'decide' ? L.cpDecide(t, f, L[btn.getAttribute('data-choice')], text) : L.cpComment(t, f, text);
      copyText(msg, function (ok) { flash(btn, ok ? L.copied : L.copyFail, !ok); });
      return;
    }
    // a confirmation is done right away; everything else becomes a comment the agent deals with
    var note = '/notes/' + encodeURIComponent(n.id);
    var req = act === 'confirm' ? post(note + '/confirm', 'POST', { about: btn.getAttribute('data-about'), lang: lang })
      : post(note + '/comment', 'POST', { text: text, lang: lang, label: act === 'answer' ? L.lblAnswer(btn.getAttribute('data-q')) : act === 'dispute' ? L.lblDispute : act === 'decide' ? L.lblDecide(L[btn.getAttribute('data-choice')]) : '' });
    btn.disabled = true;
    req.then(function () { if (ta) drafts[ta.getAttribute('data-key')] = ''; done(act === 'confirm' ? L.confirmed : L.commented); })
      .catch(function (e) { btn.disabled = false; flash(btn, L.sentErr + e.message, true); });
  }
  function startEdit() {
    var n = byId[state.sel]; if (!n || !EDIT) return;
    state.editing = n.id; state.editSrc = null; state.editErr = ''; state.editConflict = null; render();
    post('/notes/' + encodeURIComponent(n.id), 'GET').then(function (j) {
      if (state.editing !== n.id) return;
      state.editSrc = j; render();
      var t = document.querySelector('.edta'); if (t) t.focus();
    }, function (e) { state.editErr = L.sentErr + e.message; render(); });
  }
  function saveEdit(force) {
    var n = byId[state.editing], t = document.querySelector('.edta'); if (!n || !t || !state.editSrc) return;
    var b = document.querySelector('[data-save],[data-overwrite]'); if (b) { b.disabled = true; b.textContent = L.saving; }
    post('/notes/' + encodeURIComponent(n.id), 'PUT', { text: t.value, base: state.editSrc.hash, force: !!force, lang: lang })
      .then(function (j) { drafts['edit|' + n.id] = ''; state.editing = null; done(j.changed === false ? '' : L.saved); })
      .catch(function (e) {
        drafts['edit|' + n.id] = t.value;
        if (e.status === 409 && e.data && e.data.current) { state.editConflict = e.data.current; state.editErr = L.conflict; }
        else state.editErr = e.message;
        render();
      });
  }
  function endEdit() {
    if (state.editing) drafts['edit|' + state.editing] = '';
    state.editing = null; state.editSrc = null; state.editErr = ''; state.editConflict = null;
    if (stale) { done(''); return; }
    render();
  }
  function copyText(s, cb) {
    function fallback() {
      var x = document.createElement('textarea'); x.value = s; x.setAttribute('readonly', ''); x.style.position = 'fixed'; x.style.opacity = '0';
      document.body.appendChild(x); x.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} x.remove(); cb(ok);
    }
    try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(s).then(function () { cb(true); }, fallback); return; } } catch (e) {}
    fallback();
  }
  function flash(btn, msg, err) {
    var old = btn.parentNode.querySelector('.okl, .errl'); if (old) old.remove();
    var m = document.createElement('span'); m.className = err ? 'errl' : 'okl'; m.setAttribute('role', 'status'); m.textContent = msg; btn.after(m);
    setTimeout(function () { m.remove(); }, 4000);
  }
  function toast(msg) {
    if (!msg) return;
    var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 6000);
  }
  // served: when the plan changes (an agent recorded, a file was edited), the page reloads — unless the user is
  // writing something, then it says so and waits
  function writing() {
    if (state.editing) return true;
    var any = false; document.querySelectorAll('textarea[data-key]').forEach(function (t) { if (t.value.trim()) any = true; });
    return any;
  }
  if (SVC) {
    try {
      var es = new EventSource(API + '/events?t=' + encodeURIComponent(SVC.token));
      es.onmessage = function (m) {
        var d; try { d = JSON.parse(m.data); } catch (e) { return; }
        if (d.type !== 'changed' || reloading) return;
        if (writing()) { if (!stale) { stale = true; render(); } }
        else { reloading = true; location.reload(); }
      };
    } catch (e) {}
  }
  // on disk: if the page service runs on this machine, offer this plan's page there (it can be edited)
  else if (DATA.probe && DATA.id) {
    var pb = 'http://127.0.0.1:' + DATA.probe.port;
    var ctl = window.AbortController ? new AbortController() : null, ptm = setTimeout(function () { if (ctl) ctl.abort(); }, 1500);
    fetch(pb + '/api/hello', ctl ? { signal: ctl.signal } : {})
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { clearTimeout(ptm); if (j && j.omino) { svcPage = pb + '/p/' + encodeURIComponent(DATA.id); render(); } }, function () { clearTimeout(ptm); });
  }
  document.addEventListener('click', function (ev) {
    var e2 = ev.target.closest('[data-edit],[data-save],[data-overwrite],[data-reload-src],[data-cancel],[data-refresh]');
    if (e2) {
      if (e2.hasAttribute('data-edit')) startEdit();
      else if (e2.hasAttribute('data-save')) saveEdit(false);
      else if (e2.hasAttribute('data-overwrite')) saveEdit(true);
      else if (e2.hasAttribute('data-reload-src')) { drafts['edit|' + state.editing] = ''; state.editSrc = { id: state.editing, text: state.editConflict.text, hash: state.editConflict.hash }; state.editConflict = null; state.editErr = ''; render(); }
      else if (e2.hasAttribute('data-cancel')) endEdit();
      else if (e2.hasAttribute('data-refresh')) { if (!state.editing || window.confirm(L.stale + ' · ' + L.refresh + '?')) done(''); }
      return;
    }
    var a = ev.target.closest('[data-act],[data-toggle]');
    if (a) {
      if (a.hasAttribute('data-toggle')) { var q = a.parentNode.querySelector('.qa'); if (q) { q.classList.toggle('hid'); var x = q.querySelector('textarea'); if (x) x.focus(); } }
      else send(a);
      return;
    }
    var ps = ev.target.closest('[data-plans]');
    if (ps) { state.plans = !state.plans; render(); return; }
    if (state.plans && !ev.target.closest('.pmenu')) { state.plans = false; render(); }
    var fb = ev.target.closest('[data-fold]');
    if (fb && fb.closest('.canvas')) { ev.preventDefault(); ev.stopPropagation(); state.fold = !state.fold; try { localStorage.setItem('omino-fold', state.fold ? '1' : '0'); } catch (e) {} render(); return; }
    var t = ev.target.closest('[data-sel],[data-filter],[data-view],[data-oq],#attn-next,#theme');
    if (!t) return;
    if (t.hasAttribute && t.hasAttribute('data-oq')) { ev.preventDefault(); var q = document.getElementById('oq'); if (q) q.scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
    if (t.id === 'attn-next') {
      state.attnIdx = (state.attnIdx + 1) % DECIDE.length;
      state.sel = DECIDE[state.attnIdx].id;
      if (!matches(byId[state.sel])) state.filter = 'all';
      render(); revealSel(); return;
    }
    if (t.id === 'theme') {
      state.theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('omino-theme', state.theme); } catch (e) {}
    } else if (t.hasAttribute('data-filter')) state.filter = t.getAttribute('data-filter');
    else if (t.hasAttribute('data-view')) { state.view = t.getAttribute('data-view'); try { localStorage.setItem('omino-view', state.view); } catch (e) {} }
    else if (t.getAttribute('data-sel') && byId[t.getAttribute('data-sel')]) { state.sel = t.getAttribute('data-sel'); try { history.replaceState(null, '', '#' + encodeURIComponent(state.sel)); } catch (e) {} }
    else return;
    var keep = document.querySelector('.canvas, .board, .listv'), sl = keep ? keep.scrollLeft : 0, st = keep ? keep.scrollTop : 0;
    render();
    var c = document.querySelector('.canvas, .board, .listv'); if (c) { c.scrollLeft = sl; c.scrollTop = st; }
    if (t.closest && t.closest('.ov') && document.querySelector('.canvas .card.hl')) revealSel();
  });
  function fromHash() {
    var id = decodeURIComponent((location.hash || '').slice(1));
    if (id && byId[id]) { state.sel = id; if (!matches(byId[id])) state.filter = 'all'; var st = byId[id].kind === 'work' ? byId[byId[id].fm.stage] : byId[id].kind === 'stage' ? byId[id] : null; if (st && st.fm.status === 'closed') state.fold = false; return true; }
    return false;
  }
  window.addEventListener('hashchange', function () { if (fromHash()) { render(); revealSel(); } });
  var linked = fromHash();
  try { var tm = sessionStorage.getItem('omino-toast'); sessionStorage.removeItem('omino-toast'); setTimeout(function () { toast(tm); }, 300); } catch (e) {}
  render();
  if (linked) revealSel();
})();
</script>
</body>
</html>
